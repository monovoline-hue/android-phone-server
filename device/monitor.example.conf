# ============================================================================
# Android Phone Server - monitor.conf EXAMPLE
#
# Copy to ~/zonira-monitor/monitor.conf on the phone and edit real values.
# NEVER commit the real monitor.conf: it holds your Tailscale IP and any
# environment-specific identifiers. Only this example file belongs in Git.
#
# Sourced by collect.sh and run.sh. Shell syntax: KEY=value, no spaces around '='.
# ============================================================================

# --- sampling ---
SAMPLE_INTERVAL=60              # seconds between samples (current cadence is
                                # driven by watchdog-sshd.sh: INTERVAL=298)
HISTORY_RETENTION_DAYS=7        # jsonl files older than this are pruned
LOG_MAX_BYTES=262144            # 256 KiB per log before rotation
MAX_LOG_KEEP=5                  # rotated generations retained

# --- probes ---
LAN_IP_PROBE_URL="http://1.1.1.1"
LAN_IP_CACHE_TTL=600            # reuse cached LAN IP for this long (seconds)
CURL_TIMEOUT=4
TOP_TIMEOUT=5
POLL_TIMEOUT=5

# --- identity ---
# Tailscale IP cannot be self-discovered from Termux: outbound traffic from
# Termux bypasses the Tailscale tun (Android VpnService), so a probe never
# sees the 100.x address. Declare it here and verify from a workstation.
TAILSCALE_IP="100.x.y.z"        # <- your device's Tailscale IP

# --- process names ---
TERMUX_PKG="com.termux"
TAILSCALE_PKG="com.tailscale.ipn"

# --- optional ADB supplement ---
# A workstation-side adb script may write battery_adb.json to fill battery
# level/status/charging, which Termux cannot read on its own. Ignored when
# older than this (seconds).
ADB_SUPPLEMENT_MAX_AGE=600

# ============================================================================
# Alert thresholds.
# Enforced by the server/dashboard, NOT by collect.sh - the collector stays
# a dumb, honest reporter. (Documented here so thresholds live in one place.)
# ============================================================================
# CRITICAL:
#   reachable == false for 5 consecutive minutes
#   android reboot detected (uptime regression)
#   storage free < 10 GB
#   battery temperature >= 48 C
# WARNING:
#   ssh 8022 failed 3 consecutive times
#   watchdog / termux / tailscale unhealthy
#   battery temperature >= 43 C
#   storage free < 30 GB
#   battery declining and long since last charge
TH_BATT_TEMP_CRITICAL=48
TH_BATT_TEMP_WARNING=43
TH_STORAGE_FREE_CRITICAL_GB=10
TH_STORAGE_FREE_WARNING_GB=30
TH_OFFLINE_CRITICAL_MINUTES=5
TH_SSH_FAIL_WARNING_COUNT=3
